<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="kg-icon-title">
  <title id="kg-icon-title">知识银河</title>
  <defs>
    <linearGradient id="kg-bg" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b4180"/>
      <stop offset="0.55" stop-color="#242a55"/>
      <stop offset="1" stop-color="#11132b"/>
    </linearGradient>
    <radialGradient id="kg-glow" cx="0" cy="0" r="1" gradientTransform="translate(11.5 9.5) scale(11)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ea8ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8ea8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kg-ink" x1="9" y1="3" x2="15" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底板 + 星云辉光 -->
  <rect x="1" y="1" width="22" height="22" rx="5.6" fill="url(#kg-bg)"/>
  <rect x="1" y="1" width="22" height="22" rx="5.6" fill="url(#kg-glow)"/>

  <!-- 背景星点 -->
  <circle cx="5.2" cy="7.6" r="0.6" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="18.9" cy="16.3" r="0.55" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="6.1" cy="18.7" r="0.45" fill="#ffffff" fill-opacity="0.35"/>

  <!-- 积分符号 ∫ -->
  <path
    d="M13.9 5.7C13.9 4.3 13 3.4 11.9 3.4C10.8 3.4 9.9 4.3 9.9 5.7C9.9 8.7 11.4 10 11.4 12C11.4 14 9.9 15.3 9.9 18.3C9.9 19.7 10.8 20.6 11.9 20.6C13 20.6 13.9 19.7 13.9 18.3"
    stroke="url(#kg-ink)"
    stroke-width="1.9"
    stroke-linecap="round"
  />

  <!-- 四角星 -->
  <path
    d="M18.6 3.1L19.35 5.45L21.7 6.2L19.35 6.95L18.6 9.3L17.85 6.95L15.5 6.2L17.85 5.45Z"
    fill="url(#kg-ink)"
  />
  <circle cx="18.6" cy="6.2" r="0.55" fill="#2b2f55"/>
</svg>
